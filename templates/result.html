<!DOCTYPE html>
<html>
<head>
    <title>Cleaning Complete</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 { margin-top: 0; }
        .stat {
            font-size: 18px;
            margin: 12px 0;
        }
        .good { color: #4ade80; }
        .bad { color: #f87171; }
        a.button {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 14px 40px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 25px;
            font-size: 16px;
        }
        a.button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cleaning Complete</h1>

        <div class="stat">Original numbers: <strong>{{ total }}</strong></div>
        <div class="stat good">Good numbers kept: <strong>{{ kept }}</strong></div>
        <div class="stat bad">Disconnected removed: <strong>{{ removed }}</strong></div>

        <a class="button" href="{{ url_for('download', filename=download_name) }}">Download Cleaned CSV</a>
        <br><br>
        <a href="/" style="color:#94a3b8;">Clean another list</a>
    </div>
</body>
</html>
